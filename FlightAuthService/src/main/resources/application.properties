spring.application.name=FlightAuthService

server.port=8081


spring.datasource.url=jdbc:postgresql://localhost:5432/auth_service
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
app.jwt.secret=FlightAuthServiceSecretKey2099ForJWTAuthentication
app.jwt.expiration=86400000


#Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eurka.register-with-eureka=true
