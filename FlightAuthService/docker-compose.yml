

services:
  postgres:
    image: postgres:14
    container_name: FlightAuthService
    restart: always
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
        POSTGRES_DB: auth_service
        TZ: Asia/Kolkata
        PGTZ: Asia/Kolkata

    ports:
        - "5432:5432"

    volumes:

      - ./Docker/postgres_data:/var/lib/postgresql/data
      - ./Docker/init.sql:/docker-entrypoint-initdb.d/init.sql
