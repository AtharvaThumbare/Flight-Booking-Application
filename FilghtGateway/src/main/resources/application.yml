spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      routes:
        - id: AuthService
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: FlightService
          uri: lb://FLIGHT-SERVICE
          predicates:
            - Path=/api/flights/**

        - id: BookingService
          uri: lb://BOOKING-SERVICE
          predicates:
                - Path=/api/bookings/**






server:
  port: 8080

app:
  jwt:
    secret: FlightAuthServiceSecretKey2099ForJWTAuthentication
    expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
      register-with-eureka: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
